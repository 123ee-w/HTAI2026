<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>科普视频</title>
  <link rel="stylesheet" href="assets/app.css?v=ui7" />
  <script src="assets/app-data.js?v=network5" defer></script>
  <script src="assets/app-common.js?v=ui6" defer></script>
  <script src="assets/science.js?v=ui7" defer></script>
</head>
<body data-page="science">
  <main class="app-page">
    <header class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">‹</a>
      <div class="title-wrap">
        <h1>科普视频</h1>
        <div class="subtitle">每个主题一个科技感动态短视频</div>
      </div>
    </header>

    <section class="bt-card compact" data-network-panel>
      <div>
        <strong>网络同步</strong>
        <span class="status-line"><i class="status-dot" aria-hidden="true"></i><span id="cloudStatus" aria-live="polite">连接中</span></span>
        <small id="cloudSyncTime" class="sync-time">尚未同步</small>
      </div>
      <button id="cloudRefresh" class="secondary" type="button" aria-label="重新连接 TinyWebDB">重新连接</button>
    </section>

    <section class="panel" id="modeNoticePanel" hidden>
      <strong id="scienceModeNotice"></strong>
    </section>

    <section class="panel" id="themeSelectorPanel">
      <div class="section-heading">
        <div>
          <h2>选择主题</h2>
          <p class="muted">点击主题即可切换视频内容</p>
        </div>
        <span class="theme-chip" id="activeThemeChip">当前主题</span>
      </div>
      <div class="theme-grid" id="themeGrid"></div>
    </section>

    <section class="panel" id="keywordPanel" hidden>
        <h2>关键词模式</h2>
      <div class="keyword-scroll" id="keywordScroll">等待关键词发送...</div>
    </section>

    <section class="video-card">
      <video id="themeVideo" controls playsinline preload="auto" poster="assets/videos/science-video-preview-tech3.png">
        <source src="assets/videos/shenzhou-web.mp4" type="video/mp4" />
      </video>
      <p class="video-status" id="videoStatus" role="status"></p>
      <div class="video-body">
        <span class="badge"><span id="themeCode">A</span><span id="themeTitle">神舟飞船</span></span>
        <h2 id="videoLabel">神舟飞船科普视频</h2>
        <p id="themeCopy"></p>
        <div class="science-detail">
          <h3>科普重点</h3>
          <ul class="science-list" id="themeFacts"></ul>
          <div class="science-prompt" id="themePrompt"></div>
        </div>
        <p class="muted" id="themeSource"></p>
        <button id="playVideo" type="button">播放视频并打开声音</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script>
    // 关键词模式：主题按钮显示在最上方，并套用联动页模式按钮样式（只改样式，不动原有功能）
    window.addEventListener('load', function () {
      if (new URLSearchParams(location.search).get('mode') !== 'keyword') return;
      var panel = document.getElementById('themeSelectorPanel');
      if (panel) panel.hidden = false;
      var grid = document.getElementById('themeGrid');
      if (!grid) return;
      grid.className = 'mode-grid';
      grid.querySelectorAll('button').forEach(function (b) { b.className = 'mode-button'; });
    });
  </script>
  <nav class="bottom-nav" aria-label="底部导航">
    <a href="index.html">首页</a>
    <a class="active" href="science.html?v=network5">科普</a>
    <a href="device.html?v=network5">联动</a>
    <a href="quiz.html?v=network5&mode=dati">答题</a>
    <a href="rank.html">排行</a>
  </nav>
</body>
</html>
