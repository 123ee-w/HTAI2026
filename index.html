<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>航天AI讲解机</title>
  <link rel="stylesheet" href="assets/app.css?v=remote4" />
  <script src="assets/app-data.js?v=remote6" defer></script>
  <script src="assets/app-common.js?v=tech1" defer></script>
</head>
<body data-page="home">
  <main class="app-page home-page">
    <section class="home-hero">
      <div class="orbit-mark">HTAI</div>
      <p class="eyebrow">网络联动版</p>
      <h1>中国航天配套科普 APP</h1>
      <p class="hero-copy">像小程序一样打开，掌控板语音识别后通过 TinyWebDB 同步到手机，自动跳到对应科普与答题。</p>
    </section>

    <section class="bt-card compact">
      <div>
        <strong>网络同步</strong>
        <span id="cloudStatus">正在连接 TinyWebDB</span>
      </div>
      <a class="button" href="device.html?v=network2">打开联动页</a>
    </section>

    <section class="entry-grid" aria-label="首页入口">
      <a class="entry-card science" href="science.html?v=tech1">
        <span>科普视频</span>
        <small>神舟、天宫、火箭、月球、火星、北斗、大飞机、合集</small>
      </a>
      <a class="entry-card device" href="device.html?v=remote5">
        <span>联动装置</span>
        <small>查看网络状态，选择四种互动模式</small>
      </a>
      <a class="entry-card quiz" href="quiz.html">
        <span>答题区</span>
        <small>三种难度，答对加分，错题重做</small>
      </a>
      <a class="entry-card rank" href="rank.html">
        <span>排行榜</span>
        <small>查看积分和展示称号</small>
      </a>
    </section>

    <section class="tip-card">
      <strong>现场提示</strong>
      <p>掌控板说出主题后，网页通过 TinyWebDB 自动切换视频；说“答题”进入答题区。</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="底部导航">
    <a class="active" href="index.html">首页</a>
    <a href="science.html?v=tech1">科普</a>
    <a href="device.html?v=remote5">联动</a>
    <a href="quiz.html">答题</a>
  </nav>
</body>
</html>
