<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>答题区</title>
  <link rel="stylesheet" href="assets/app.css?v=network2" />
  <script src="assets/app-data.js?v=remote6" defer></script>
  <script src="assets/app-common.js?v=network2" defer></script>
  <script src="assets/quiz.js?v=network2" defer></script>
</head>
<body data-page="quiz">
  <main class="app-page">
    <header class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">‹</a>
      <div class="title-wrap">
        <h1>答题区</h1>
        <div class="subtitle">答对 +10 分，答错 -10 分，错题可以重做</div>
      </div>
    </header>

    <section class="bt-card compact" data-network-panel>
      <div>
        <strong>网络同步</strong>
        <span id="cloudStatus">正在连接 TinyWebDB</span>
      </div>
      <button id="cloudRefresh" class="secondary" type="button">刷新</button>
    </section>

    <section class="panel">
      <div class="quiz-stats" aria-label="答题统计">
        <div><span>积分</span><strong id="scoreText">0</strong></div>
        <div><span>答对</span><strong id="correctText">0 题</strong></div>
        <div><span>答错</span><strong id="wrongText">0 题</strong></div>
        <div><span>难度</span><strong id="levelText">简单</strong></div>
      </div>
    <p class="muted stats-note">数据保存在当前浏览器，并同步到 TinyWebDB。</p>
    </section>

    <section class="panel">
      <h2>选择难度</h2>
      <div class="quiz-grid" id="levelGrid">
        <button class="active" data-level="easy" type="button">简单</button>
        <button data-level="normal" type="button">进阶</button>
        <button data-level="hard" type="button">挑战</button>
      </div>
    </section>

    <section class="panel">
      <h2>当前题目</h2>
      <div class="question-box" id="questionText">准备出题...</div>
      <div class="choice-grid" id="choiceGrid"></div>
      <div class="button-row">
        <button id="nextQuestion" type="button">下一题</button>
        <button id="speakQuestion" class="secondary" type="button">朗读题目</button>
        <button id="speakExplain" class="secondary" type="button">朗读讲解</button>
        <a class="button secondary" href="rank.html">看排行</a>
      </div>
      <p class="muted" id="quizNotice">请选择一个答案。</p>
      <div class="answer-explanation" id="answerExplanation" hidden></div>
    </section>

    <section class="panel">
      <h2>错题本</h2>
      <ul class="list" id="wrongList"></ul>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <nav class="bottom-nav" aria-label="底部导航">
    <a href="index.html">首页</a>
    <a href="science.html?v=tech1">科普</a>
    <a href="device.html?v=remote5">联动</a>
    <a class="active" href="quiz.html">答题</a>
  </nav>
</body>
</html>
