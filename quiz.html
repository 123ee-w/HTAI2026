<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>答题区</title>
  <link rel="stylesheet" href="assets/app.css?v=ui7" />
  <script src="assets/app-data.js?v=remote6" defer></script>
  <script src="assets/app-common.js?v=ui6" defer></script>
  <script src="assets/quiz.js?v=ui7" defer></script>
</head>
<body data-page="quiz">
  <main class="app-page">
    <header class="topbar">
      <a class="back" href="index.html" aria-label="返回首页">‹</a>
      <div class="title-wrap">
        <h1>答题区</h1>
        <div class="subtitle">答对 +10 分，答错 -10 分，错题可以重做</div>
      </div>
    </header>

    <section class="bt-card compact" data-network-panel>
      <div>
        <strong>网络同步</strong>
        <span class="status-line"><i class="status-dot" aria-hidden="true"></i><span id="cloudStatus" aria-live="polite">连接中</span></span>
        <small id="cloudSyncTime" class="sync-time">尚未同步</small>
      </div>
      <button id="cloudRefresh" class="secondary" type="button" aria-label="重新连接 TinyWebDB">重新连接</button>
    </section>

    <section class="panel">
      <div class="quiz-stats" aria-label="答题统计">
        <div><strong id="scoreText">积分：0分</strong></div>
        <div>
          <strong id="correctText">答对：0题</strong><span class="stats-separator">，</span><strong id="wrongText">答错：0题</strong>
        </div>
        <div><span>难度</span><strong id="levelText">未选择</strong></div>
      </div>
      <p class="muted stats-note">数据保存在当前浏览器，并同步到 TinyWebDB。</p>
      <button id="resetQuiz" class="secondary" type="button">重置答题数据</button>
    </section>

    <section class="panel">
      <h2>选择难度</h2>
      <div class="quiz-grid" id="levelGrid">
        <button class="active" data-level="easy" type="button">简单</button>
        <button data-level="normal" type="button">进阶</button>
        <button data-level="hard" type="button">挑战</button>
      </div>
    </section>

    <section class="panel" id="startPanel">
      <h2>是否开始答题？</h2>
      <p class="muted">选择难度后，点击“开始答题”。每题会先朗读题目和选项，朗读结束后才开始 20 秒倒计时。</p>
      <div class="button-row two">
        <button id="startQuiz" type="button">是，开始答题</button>
        <button id="pauseQuiz" class="secondary" type="button">暂不开始</button>
      </div>
    </section>

    <section class="panel">
      <div class="quiz-progress-head">
        <h2>当前题目</h2>
        <strong id="questionProgress">第 1 / 30 题</strong>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="quizProgressBar"></span></div>
    </section>

    <section class="panel">
      <div class="question-box" id="questionText">准备出题...</div>
      <div class="choice-grid" id="choiceGrid"></div>
      <div class="button-row">
        <button id="nextQuestion" type="button">下一题</button>
        <button id="speakQuestion" class="secondary" type="button">朗读题目</button>
        <button id="speakExplain" class="secondary" type="button">朗读讲解</button>
        <a class="button secondary" href="rank.html">看排行</a>
      </div>
      <p class="muted" id="quizNotice" aria-live="polite">请选择一个答案。</p>
      <div class="answer-explanation" id="answerExplanation" hidden></div>
      <section class="quiz-summary" id="quizSummary" hidden aria-live="polite"></section>
    </section>

    <section class="panel">
      <h2>错题本</h2>
      <ul class="list" id="wrongList"></ul>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <nav class="bottom-nav" aria-label="底部导航">
    <a href="index.html">首页</a>
    <a href="science.html?v=network5">科普</a>
    <a href="device.html?v=network5">联动</a>
    <a class="active" href="quiz.html?v=network5&mode=dati">答题</a>
    <a href="rank.html">排行</a>
  </nav>
</body>
</html>
